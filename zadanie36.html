
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Zadanie 36</title>

<style>
    body {
        background-color: yellow;
        text-align: center;
        border: 6px solid pink;
        padding: 23px;
    }

    h1 {
        background-color: blue;
        border: 6px solid black;
        padding: 9px;
        width: 60%;
        margin: 20px auto;
    }

    h2 {
        background-color: green;
        border-top: 4px dotted orange;
        border-bottom: 4px dotted purple;
        border-left: 4px dotted black;
        border-right: 4px dotted yellow;
        padding: 10px;
        width: 60%;
        margin: 20px auto;
    }

    h3 {
        background-color: blue;
        border-top: 6px red;
        border-bottom: 6px orange;
        border-left: 6px inset black;
        border-right: 6px pink;
        padding: 10px;
        width: 70%;
        margin: 20px auto;
    }

    .hr1 {
        width: 60%;
        height: 2px;
        background-color: orange;
    }

    .hr2 {
        width: 50%;
        height: 4px;
        background-color: purple;
    }

    .hr3 {
        width: 40%;
        height: 6px;
        background-color: gray;
    }
</style>

</head>
<body>

<h1>To jest przykład</h1>
<hr class="hr1">

<h2>To jest przykład wykonaj sam</h2>
<hr class="hr2">

<h3>To jest przykład wykonaj również</h3>
<hr class="hr3">

</body>
</html>
